# Una entrada por producto. Para añadir otro: copia un bloque y cambia los valores.
# id         -> nombre de la carpeta en data/ y etiqueta en todos los ficheros
# query      -> texto de búsqueda en Wallapop
# category   -> category_id (motos = 14000). Opcional
# min_price  -> filtro de precio mínimo del servidor (quita recambios). Opcional
# max_price  -> opcional
# max_pages  -> páginas máximas a recorrer (por defecto 12)
# scope      -> filtros del ANÁLISIS (no cambian lo que se descarga). clean.py marca in_scope=1/0:
#                 variant: nombre de variante (solo motos)    conditions: [as_good_as_new, good, new, fair, has_given_it_all]
#                 year: [min, max]   km: [min, max]   a2: true (descarta las que dicen explícitamente que NO van limitadas)
#                 max_days_listed: descarta anuncios publicados hace más de N días
#               Un dato desconocido NO cumple year/km/conditions/variant; en a2 desconocido sí entra.
# extractor  -> moto | generic (qué columnas y reglas usa clean.py)
# lat/lon    -> centro de búsqueda (por defecto Barcelona)
# distance_km-> radio de búsqueda desde lat/lon (opcional; sin él, toda España)
products:
  - id: kymco-k-xct-125
    query: "kymco k xct 125"
    category: 14000
    min_price: 1500
    extractor: moto

  - id: triumph-trident-660
    query: "triumph trident 660"
    category: 14000
    min_price: 4000   # por debajo: estafa o moto destrozada (filtro de limpieza, no presupuesto)
    max_price: 7000   # por encima: casi nueva (filtro de limpieza)
    distance_km: 300   # Cataluña y alrededores
    extractor: moto
    scope:
      variant: "Trident 660"
      year: [2021, 2024]
      km: [10000, 25000]
      a2: true

  - id: nux-mg-30
    query: "nux mg-30"
    category: 12463   # Cine, libros y música (instrumentos)
    min_price: 120    # por debajo: solo accesorio o estafa
    max_price: 220    # por encima: pack o incluye más cosas
    extractor: generic   # se envía por correo: toda España, sin radio
    scope:
      conditions: [as_good_as_new, good]
