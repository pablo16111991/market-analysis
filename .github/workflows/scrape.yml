name: scrape
on:
  schedule:
    - cron: '17 6 * * *'   # cada día
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx pyyaml
      - run: python collect.py
      - run: python clean.py
      - name: Pisos (Fotocasa)
        continue-on-error: true
        run: |
          python pisos/collect.py
          python pisos/clean.py
      - name: Commit
        run: |
          git config user.name "wallapop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "scrape $(date -u +%F)"
          git pull --rebase -q
          git push
