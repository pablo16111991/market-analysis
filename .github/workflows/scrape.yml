name: scrape
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: ./run.sh kymco-k-xct-125 "kymco k xct 125" 14000 1500
      - name: Commit
        run: |
          git config user.name "wallapop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "scrape $(date -u +%F)"
          git push
