name: scrape-pisos
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-commits   # comparten grupo: no corren a la vez y se evitan choques al subir
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx pyyaml
      - run: python pisos/collect.py
      - run: python pisos/clean.py
      - name: Commit
        if: always()
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pisos
          git diff --cached --quiet || git commit -m "scrape-pisos $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
