name: dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: [scrape-pisos, scrape-second-hand]
    types: [completed]
  push:
    branches: [main]
    paths: ['dashboard/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python dashboard/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/site
      - id: dep
        uses: actions/deploy-pages@v4
